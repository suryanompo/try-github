<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homepage</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background: white;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 480px;
    }
    .btn {
      display: inline-block;
      background-color: #28a745;
      color: white;
      padding: 10px 16px;
      border-radius: 6px;
      text-decoration: none;
    }
    .btn:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Selamat Datang di Homepage!</h1>
    <p>Ini adalah halaman utama sederhana. Terima kasih sudah berkunjung!</p>
    <a class="btn" href="index.html">Kembali ke Halaman Profil</a>
  </main>
</body>
</html>
